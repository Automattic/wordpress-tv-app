# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# Variables used in this pipeline (IMAGE_ID, CI_TOOLKIT) are defined in
# `.buildkite/shared-pipeline-vars`, which is `source`'d before calling
# `buildkite-agent pipeline upload`.

env:
  IMAGE_ID: $IMAGE_ID

steps:
  # ---------------------------------------------------------------------------
  # 📺 Apple (tvOS) — apple/
  # Runs on the macOS fleet; uses Fastlane/Xcode under apple/.
  # ---------------------------------------------------------------------------
  - group: ":apple: Apple (tvOS)"
    key: "apple"
    steps:
      - label: "📺 Build and Test"
        key: "apple-build-and-test"
        command: ".buildkite/commands/apple/build-and-test.sh"
        agents:
          queue: mac
        plugins: [$CI_TOOLKIT]
        # Publish this step's result as a commit status on GitHub (the check that
        # shows up on commits and PRs). Keep the context string stable — branch
        # protection may reference it.
        notify:
          - github_commit_status:
              context: "Build and Test"

      # Ship a TestFlight build on every push to trunk, but only once tests pass.
      - label: "🚀 TestFlight"
        command: ".buildkite/commands/apple/build-and-upload-to-testflight.sh"
        agents:
          queue: mac
        plugins: [$CI_TOOLKIT]
        depends_on: "apple-build-and-test"
        branches: "trunk"

  # ---------------------------------------------------------------------------
  # 🤖 Android (Google TV) — android/
  # Runs the :core unit tests and assembles the debug APK with Gradle. Needs a
  # Linux agent with the Android SDK — Gradle does not need the macOS fleet. If
  # your Buildkite doesn't have an `android` queue yet, point this at one that
  # has the SDK (e.g. `queue: mac`) until it does.
  # ---------------------------------------------------------------------------
  - group: ":android: Android (Google TV)"
    key: "android"
    steps:
      - label: "🤖 Build and Test"
        key: "android-build-and-test"
        command: ".buildkite/commands/android/build-and-test.sh"
        agents:
          queue: android

      # Build a signed release APK on trunk and keep it as a Buildkite artifact
      # (grab it from the build's Artifacts tab — e.g. to upload to Play). Needs
      # $CI_TOOLKIT to provision the upload-key secrets (UPLOAD_KEYSTORE_*).
      - label: "📦 Release APK"
        key: "android-release-apk"
        command: ".buildkite/commands/android/build-and-upload-release.sh"
        agents:
          queue: android
        plugins: [$CI_TOOLKIT]
        depends_on: "android-build-and-test"
        branches: "trunk"
