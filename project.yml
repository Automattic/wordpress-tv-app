name: WordPressTV

options:
  bundleIdPrefix: tv.wordpress
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  WordPressTVCore:
    path: WordPressTVCore

targets:
  WordPressTV:
    type: application
    platform: tvOS
    sources:
      - path: WordPressTV
    dependencies:
      - package: WordPressTVCore
    info:
      path: WordPressTV/Info.plist
      properties:
        CFBundleDisplayName: WordPress.tv
        UIUserInterfaceStyle: Dark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tv.wordpress.WordPressTV
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "6.0"
        CODE_SIGN_STYLE: Automatic
        # Simulator-only for the scaffold; device/TestFlight signing comes later.
        CODE_SIGNING_ALLOWED: NO
